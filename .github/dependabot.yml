version: 2
updates:
  # One weekly PR with every minor and patch update. Major versions need
  # migration work (framework, compiler, validation changes), so they are
  # upgraded deliberately rather than by automated PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # All workflow action updates together, once a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']

  # Stay on the Node.js 22 LTS line used by .nvmrc and Vercel.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
